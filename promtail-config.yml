# Promtail config — naijagist prod server (91.98.147.212)
# Ships all Docker container logs to central Loki on softbrains-strapi.
#

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://137.184.211.73:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values: ["running"]
    relabel_configs:
      # Container name (strip leading slash)
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      # Docker image
      - source_labels: [__meta_docker_container_image]
        target_label: image
      # Compose service name
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      # Which server these logs came from
      - target_label: server
        replacement: naijagist-prod-infra
      - target_label: job
        replacement: docker
