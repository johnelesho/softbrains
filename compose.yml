# ============================================================
# 9jagist — Infrastructure Server Compose
# Server role: infra (postgres, redis, rabbitmq, pgadmin)
# App server connects to this server via INFRA_SERVER_PRIVATE_IP
# ============================================================

services:


  postgres:
    image: postgres:16-alpine
    container_name: naijagist-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5432:5432"
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: naijagist-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - infra
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # RabbitMQ — with management UI on port 15672
  # ----------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: naijagist-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"    # AMQP — used by app/auth services
      - "15672:15672"  # Management UI — restrict to VPN/bastion only
    networks:
      - infra
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  # pgAdmin — web UI for both Postgres databases
  # Access: http://<INFRA_SERVER_IP>:5050
  # ----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: naijagist-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgladmin4/servers.json:ro  # pre-register both DBs
    ports:
      - "5050:80"
    networks:
      - infra
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------
  # Watchtower — auto-update infra images (optional)
  # Remove if you prefer manual updates for infra
  # ----------------------------------------------------------
#  watchtower:
#    image: containrrr/watchtower:latest
#    container_name: watchtower-infra
#    restart: always
#    volumes:
#      - /var/run/docker.sock:/var/run/docker.sock
#    environment:
#      - WATCHTOWER_POLL_INTERVAL=3600  # check hourly
#      - WATCHTOWER_CLEANUP=true
#    command: --label-enable --cleanup

networks:
  infra:
    driver: bridge
    name: naijagist-infra

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  pgadmin_data: